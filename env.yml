# Conda environment for Fudan AIDD project.
# Per CLAUDE.md §4: rdkit pinned to 2024.03.* (canonical SMILES cross-version stability).
# Create: mamba env create -f env.yml -n drug
# Update: mamba env update -f env.yml -n drug --prune
name: drug
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # ---- Scientific Python core (pinned, conda) ----
  - numpy=1.26.*
  - pandas=2.2.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - statsmodels=0.14.*
  - matplotlib=3.9.*
  - seaborn=0.13.*

  # ---- Cheminformatics (pinned per CLAUDE.md §4) ----
  - rdkit=2024.03.*

  # ---- PyTorch (CUDA 12.1, change to your server's CUDA version if different) ----
  - pytorch=2.4.*
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio

  # ---- Notebooks ----
  - jupyterlab
  - ipykernel

  # ---- Dev tools ----
  - make

  # ---- Pip-only packages ----
  - pip:
      # Molecular property prediction
      - chemprop>=2.0.4
      - deepchem>=2.8.0
      - unimol-tools>=0.1.1
      # Foundation models
      - transformers>=4.44
      - peft>=0.12
      - accelerate>=0.33
      - bitsandbytes>=0.43
      - datasets>=2.20
      # Training framework
      - pytorch-lightning>=2.4
      # Config + experiment tracking
      - hydra-core>=1.3
      - omegaconf>=2.3
      - wandb>=0.17
      # Uncertainty quantification (CLAUDE.md §13)
      # - muben  # install from GitHub if needed: pip install git+https://github.com/Yinghao-Li/MUBen
      # Dev
      - ruff>=0.6
      - mypy>=1.11
      - pytest>=8.0
      - pytest-cov>=5.0
      - pre-commit>=3.8
      # Project itself (editable)
      - -e .
